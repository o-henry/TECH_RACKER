version: 1
technologies:
  - id: alzheimer-blood-test
    openalex:
      - key: plasma-biomarkers
        search: 'plasma p-tau217 amyloid Alzheimer blood test'
        include_terms: ['p-tau217', 'ptau217', 'amyloid', 'blood', 'plasma']
        exclude_terms: ['mouse model', 'murine']
        min_score: 0.25
    clinical_trials:
      - key: blood-biomarker
        query: 'Alzheimer Disease AND (p-tau217 OR plasma amyloid)'
        include_terms: ['p-tau217', 'ptau217', 'plasma', 'blood', 'amyloid']
        min_score: 0.2

  - id: in-vivo-gene-editing
