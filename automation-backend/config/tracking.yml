        min_score: 0.25
    clinical_trials:
      - key: xenokidney
        query: 'kidney xenotransplantation pig'
        include_terms: ['xenotransplant', 'pig', 'porcine', 'kidney']
        min_score: 0.2
    sec:
      - key: united-therapeutics
        ticker: UTHR
        forms: ['8-K', '10-Q', '10-K']
        include_terms: ['xenotransplant', 'ukidney', 'pig kidney', 'revivicor']

  - id: stem-cell-islets
    openalex:
      - key: stem-cell-islets
        search: 'stem cell derived islet cells type 1 diabetes clinical'
        include_terms: ['stem cell-derived', 'islet cells', 'type 1 diabetes', 'beta cells']
        min_score: 0.25
    clinical_trials:
      - key: stem-cell-islets
        query: 'stem cell derived islet type 1 diabetes'
        include_terms: ['islet', 'stem cell', 'type 1 diabetes', 'zimislecel', 'vx-880']
