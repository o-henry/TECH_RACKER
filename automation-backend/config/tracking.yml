version: 1
technologies:
  - id: alzheimer-blood-test
    openalex:
      - key: plasma-biomarkers
        search: 'plasma p-tau217 amyloid Alzheimer blood test'
        include_terms: ['p-tau217', 'ptau217', 'amyloid', 'blood', 'plasma']
        exclude_terms: ['mouse model', 'murine']
        min_score: 0.25
    clinical_trials:
      - key: blood-biomarker
        query: 'Alzheimer Disease AND (p-tau217 OR plasma amyloid)'
        include_terms: ['p-tau217', 'ptau217', 'plasma', 'blood', 'amyloid']
        min_score: 0.2

  - id: in-vivo-gene-editing
    openalex:
      - key: systemic-crispr
        search: 'in vivo CRISPR genome editing therapy clinical'
        include_terms: ['in vivo', 'crispr', 'genome editing', 'gene editing']
        exclude_terms: ['ex vivo']
        min_score: 0.25
    clinical_trials:
      - key: in-vivo-crispr
        query: 'AREA[InterventionName](CRISPR) AND (in vivo OR genome editing)'
        include_terms: ['crispr', 'gene editing', 'genome editing', 'nexiguran', 'ntla']
        min_score: 0.2
    sec:
      - key: intellia
        ticker: NTLA
        forms: ['8-K', '10-Q', '10-K']
        include_terms: ['nexiguran', 'nex-z', 'magnitude', 'crispr', 'in vivo', 'clinical hold']

  - id: personalized-cancer-vaccine
    openalex:
      - key: neoantigen-vaccine
        search: 'personalized neoantigen cancer vaccine clinical trial'
        include_terms: ['personalized', 'neoantigen', 'cancer vaccine', 'mrna vaccine']
        min_score: 0.25
    clinical_trials:
      - key: neoantigen-vaccine
        query: 'personalized neoantigen cancer vaccine'
        include_terms: ['neoantigen', 'personalized', 'vaccine', 'mrna-4157', 'v940']
        min_score: 0.2
    sec:
      - key: moderna
        ticker: MRNA
        forms: ['8-K', '10-Q', '10-K']
        include_terms: ['v940', 'mrna-4157', 'individualized neoantigen', 'personalized cancer vaccine']
      - key: merck
        ticker: MRK
        forms: ['8-K', '10-Q', '10-K']
        include_terms: ['v940', 'mrna-4157', 'individualized neoantigen', 'personalized cancer vaccine']

  - id: xenokidney
