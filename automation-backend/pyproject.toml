[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "technology-tracker-live"
version = "0.2.0"
description = "Technology evidence tracker with OpenAlex, ClinicalTrials.gov and SEC EDGAR ingestion"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "SQLAlchemy==2.0.52",
  "alembic==1.19.1",
  "asyncpg==0.31.0",
  "httpx==0.28.1",
  "pydantic-settings==2.15.0",
  "PyYAML==6.0.3",
  "APScheduler==3.11.3",
  "beautifulsoup4==4.15.0",
  "orjson==3.12.0",
  "mcp>=1.26.0,<2.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.12.10"
]

[project.scripts]
technology-tracker = "app.cli:main"
technology-tracker-scheduler = "app.scheduler:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B007", "B008"]
